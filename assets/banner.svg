<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="diffAddGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="diffSubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: pulseOrb1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulseOrb2 10s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8 12;
        animation: dashMove 6s linear infinite;
      }
      .code-line-add {
        animation: shimmerGreen 3s ease-in-out infinite alternate;
      }
      .code-line-sub {
        animation: shimmerRed 3s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulseOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 30px) scale(1.25); opacity: 0.6; }
      }
      @keyframes pulseOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        100% { transform: translate(-50px, -20px) scale(1.2); opacity: 0.55; }
      }
      @keyframes shimmerGreen {
        0% { opacity: 0.85; }
        100% { opacity: 1; }
      }
      @keyframes shimmerRed {
        0% { opacity: 0.75; }
        100% { opacity: 0.95; }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.8)); }
      }
    </style>
  </defs>

  <!-- Deep Workspace Background -->
  <rect width="1280" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <g>
    <circle class="glow-orb-1" cx="220" cy="90" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle class="glow-orb-2" cx="1060" cy="320" r="190" fill="#7c3aed" filter="url(#glow)" />
    <circle cx="640" cy="210" r="220" fill="#0f766e" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
  </g>

  <!-- Dynamic Branching Flow Lines (Behind text) -->
  <g stroke-linecap="round" opacity="0.6">
    <path class="flow-pulse" d="M 100 370 Q 240 330 380 370 T 660 370 T 940 370 T 1180 370" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-pulse" d="M 120 40 Q 300 80 500 50 T 880 50 T 1160 50" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Floating Decorative Diff Snippet Left Side (Subtle aesthetic backdrop) -->
  <g opacity="0.75" transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <rect x="14" y="12" width="8" height="8" rx="4" fill="#ef4444" />
    <rect x="28" y="12" width="8" height="8" rx="4" fill="#f59e0b" />
    <rect x="42" y="12" width="8" height="8" rx="4" fill="#10b981" />
    <text x="60" y="19" fill="#64748b" font-size="9" font-family="monospace">diff --git a/hunk.rs</text>
    <rect class="code-line-sub" x="14" y="36" width="212" height="22" rx="4" fill="url(#diffSubGrad)" />
    <text x="22" y="51" fill="#fca5a5" font-size="11" font-family="monospace">- const OLD_PATCH: bool;</text>
    <rect class="code-line-add" x="14" y="66" width="212" height="22" rx="4" fill="url(#diffAddGrad)" />
    <text x="22" y="81" fill="#86efac" font-size="11" font-family="monospace">+ const AST_PARSED: bool;</text>
    <rect class="code-line-add" x="14" y="96" width="212" height="22" rx="4" fill="url(#diffAddGrad)" />
    <text x="22" y="111" fill="#86efac" font-size="11" font-family="monospace">+ stage_hunk_interactive();</text>
    <text x="22" y="138" fill="#94a3b8" font-size="10" font-family="monospace">@@ -14,7 +14,9 @@ 3-Way Merge</text>
    <text x="22" y="158" fill="#38bdf8" font-size="10" font-family="monospace">✓ 0 conflicts detected</text>
  </g>

  <!-- Floating Decorative Diff Snippet Right Side (Subtle aesthetic backdrop) -->
  <g opacity="0.75" transform="translate(990, 115)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <rect x="14" y="12" width="8" height="8" rx="4" fill="#ef4444" />
    <rect x="28" y="12" width="8" height="8" rx="4" fill="#f59e0b" />
    <rect x="42" y="12" width="8" height="8" rx="4" fill="#10b981" />
    <text x="60" y="19" fill="#64748b" font-size="9" font-family="monospace">AST Syntax Diff</text>
    <rect class="code-line-add" x="14" y="36" width="212" height="22" rx="4" fill="url(#diffAddGrad)" />
    <text x="22" y="51" fill="#86efac" font-size="11" font-family="monospace">+ tree_sitter::parse(diff);</text>
    <rect class="code-line-sub" x="14" y="66" width="212" height="22" rx="4" fill="url(#diffSubGrad)" />
    <text x="22" y="81" fill="#fca5a5" font-size="11" font-family="monospace">- legacy_regex_pager();</text>
    <rect class="code-line-add" x="14" y="96" width="212" height="22" rx="4" fill="url(#diffAddGrad)" />
    <text x="22" y="111" fill="#86efac" font-size="11" font-family="monospace">+ delta::render_syntax();</text>
    <text x="22" y="138" fill="#94a3b8" font-size="10" font-family="monospace">@@ AST Structural match</text>
    <text x="22" y="158" fill="#a855f7" font-size="10" font-family="monospace">⚡ Difftastic / Lazygit</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed never obscured) -->
  <g text-anchor="middle">
    <!-- Category Mini-Badge -->
    <g class="badge-glow" transform="translate(640, 68)">
      <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2.5">⚡ THE DEFINITIVE CURATED REGISTRY ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="640" y="150" fill="#ffffff" font-size="40" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">
      Awesome Git DIFF &amp; Code Patching Tools
    </text>

    <!-- Gradient Subtitle Bar -->
    <text x="640" y="195" fill="url(#accentGrad)" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">
      Interactive Hunk Staging • AST Structural Diffing • 3-Way Merge GUIs • Terminal Pagers
    </text>

    <!-- Detailed Supporting Tagline -->
    <text x="640" y="235" fill="#94a3b8" font-size="14.5" font-family="system-ui, -apple-system, sans-serif">
      Empowering developers &amp; AI agents with precision code review, surgical patching, and merge conflict resolution
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(640, 290)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
        <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🎯 Hunk Staging</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
        <text x="0" y="5" fill="#5eead4" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🌲 AST Syntax Diff</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
        <text x="0" y="5" fill="#fcd34d" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🔀 3-Way Merging</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(270, 0)">
        <rect x="-85" y="-17" width="170" height="32" rx="16" fill="#3b0764" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="5" fill="#e9d5ff" font-size="12" font-weight="600" font-family="system-ui, sans-serif">📟 Terminal Pagers</text>
      </g>
    </g>

    <!-- Footer Stats / Versioning -->
    <text x="640" y="355" fill="#64748b" font-size="12" font-family="monospace">
      Lazygit • Bat • Delta • Difftastic • GitButler • Diff-so-fancy • Magit • WinMerge • Meld • KDiff3
    </text>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />
</svg>
